name: fin-data-admin-dev

services:
  postgres:
    image: postgres:15-alpine
    container_name: fin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-fin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fin_dev}
      POSTGRES_DB: ${DB_NAME:-fin_data}
      TZ: Asia/Shanghai
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-fin} -d ${DB_NAME:-fin_data}']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fin-redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
  redis_data:
