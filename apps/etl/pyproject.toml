[project]
name = "fin-etl"
version = "0.1.0"
description = "Financial Data ETL Pipeline"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pandas>=2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dateutil>=2.8.2",
    "schedule>=1.2.0",
    "httpx>=0.25",
    "tenacity>=8.2",
    "structlog>=24.0",
    "pyyaml>=6.0",
    "tushare>=1.2.89",
    "six>=1.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["etl"]  # 明确告诉 setuptools 只把 etl 目录当作 Python 代码包

[tool.setuptools.package-data]
etl = ["../config/validation/*.yaml"] # 把 config 当作数据文件打包进去
