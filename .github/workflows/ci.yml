name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  quality-check:
    name: Lint & Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      # 👇 1. 必须先把代码拉下来，并且拉取完整历史
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 👇 2. 拉取代码后再执行 Gitleaks，并指定白名单配置
      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 必须先构建 shared-types，否则 web/api 的 typecheck 找不到类型
      - name: Build shared types
        run: pnpm build --filter @fin/shared-types

      - name: Run ESLint
        run: pnpm lint

      - name: Run TypeScript type check
        run: pnpm typecheck

      - name: Run backend tests with coverage
        run: pnpm --filter @fin/api test:cov

      - name: Run frontend tests
        run: pnpm --filter @fin/web test

  build-images:
    name: Build Docker Images
    needs: quality-check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 👇 3. 直接把全小写仓库名设置到环境变量中
      - name: Lowercase repository name
        run: |
          echo "IMAGE_REPO=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          # 👇 4. 使用全小写变量
          tags: ghcr.io/${{ env.IMAGE_REPO }}/api:latest,ghcr.io/${{ env.IMAGE_REPO }}/api:sha-${{ github.sha }}

      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          # 👇 5. 使用全小写变量
          tags: ghcr.io/${{ env.IMAGE_REPO }}/web:latest,ghcr.io/${{ env.IMAGE_REPO }}/web:sha-${{ github.sha }}
