name: Import Issues from CSV

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry Run (Check format without creating issues)'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Issue Importer
        uses: dsanchezcr/issue-importer-action@v1.0.0
        with:
          file-path: '.github/data/tasks.csv'
          file-format: 'csv'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          dry-run: ${{ github.event.inputs.dry_run }}
